name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run --project node
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:package
      - run: npm run size
      - run: npm run build-storybook

  test:
    name: Test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx vitest run --project ${{ matrix.browser }}
      - if: matrix.browser == 'chromium'
        run: npx vitest run --project contrast

  visual:
    name: Visual (Chromium, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The tests run in the Playwright Docker image, the same one `npm run test:visual` uses locally.
      - run: node scripts/visual.ts
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: .vitest/visual
          if-no-files-found: ignore
