name: Release

# Opens (or updates) a "Version Packages" PR from merged changesets.
# Merging that PR publishes to npm with trusted publishing (OIDC): no npm token
# is stored in GitHub secrets. Trusted publishing must be enabled once on
# npmjs.com for this repository and workflow file.

#
# Manual for now: before the first release (v0.1.0) there is nothing to publish,
# and the package must exist on npm before trusted publishing can be enabled.
# After the first manual `npm publish`, switch this to:
#   on:
#     push:
#       branches: [main]
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - uses: changesets/action@v2
        with:
          version: npm run version-packages
          publish: npm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Provenance needs CI (OIDC) and a public repository, so it is set here
          # rather than in package.json, where it would break a local `npm publish`.
          NPM_CONFIG_PROVENANCE: true
